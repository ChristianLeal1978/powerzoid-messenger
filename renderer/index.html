<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'" />
<title>WhatsApp Sidebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="rail" id="rail"></div>

  <!-- Pantalla de emparejamiento por QR -->
  <div id="qr-screen" class="screen">
    <div class="qr-card">
      <div class="brand">WhatsApp<span>Sidebar</span></div>
      <p class="hint">Escanea con tu teléfono<br />WhatsApp &rarr; Dispositivos vinculados</p>
      <div class="qr-frame"><img id="qr-img" alt="Código QR" /></div>
      <p class="status-text" id="qr-status">Esperando código&hellip;</p>
      <button type="button" id="qr-refresh-btn" class="qr-refresh-btn">Generar nuevo código</button>
    </div>
  </div>

  <!-- App principal -->
  <div id="app" class="screen hidden">
    <header class="topbar">
      <span class="dot" id="status-dot"></span>
      <span class="topbar-title">WhatsApp</span>
    </header>

    <div id="chat-list-status" class="inline-status hidden"></div>
    <section id="chat-list" class="chat-list"></section>

    <div class="divider" id="divider" title="Arrastra para ajustar el alto"></div>

    <section id="conversation" class="conversation">
      <div class="conv-empty" id="conv-empty">Selecciona una conversación arriba</div>

      <div class="conv-active hidden" id="conv-active">
        <div class="conv-header">
          <button id="back-btn" class="back-btn" aria-label="Volver">&larr;</button>
          <span id="conv-name" class="conv-name"></span>
        </div>
        <div id="messages" class="messages"></div>
        <div id="mention-list" class="mention-list hidden"></div>
        <div id="emoji-picker" class="emoji-picker hidden"></div>
        <form id="composer" class="composer">
          <button type="button" id="emoji-btn" class="emoji-btn" aria-label="Emojis">&#9786;</button>
          <textarea id="composer-input" rows="1" placeholder="Escribe un mensaje"></textarea>
          <button type="submit" aria-label="Enviar">&#10148;</button>
        </form>
      </div>
    </section>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
