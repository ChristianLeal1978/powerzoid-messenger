<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'" />
<title>Powerzoid Messenger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="rail" id="rail"></div>

  <div class="tab-bar" id="tab-bar">
    <button type="button" class="tab-btn active" data-provider="wa">WhatsApp<span class="tab-dot hidden"></span></button>
    <button type="button" class="tab-btn" data-provider="sl">Slack<span class="tab-dot hidden"></span></button>
  </div>

  <!-- Pantalla de emparejamiento por QR (WhatsApp) -->
  <div id="qr-screen" class="screen">
    <div class="qr-card">
      <div class="brand">WhatsApp<span>Sidebar</span></div>
      <p class="hint">Escanea con tu teléfono<br />WhatsApp &rarr; Dispositivos vinculados</p>
      <div class="qr-frame"><img id="qr-img" alt="Código QR" class="hidden" /></div>
      <p class="status-text" id="qr-status">Esperando código&hellip;</p>
      <button type="button" id="qr-refresh-btn" class="qr-refresh-btn">Generar nuevo código</button>
    </div>
  </div>

  <!-- Pantalla de emparejamiento de Slack -->
  <div id="slack-pairing-screen" class="screen hidden">
    <div class="qr-card">
      <div class="brand">Slack<span>Sidebar</span></div>
      <p class="hint">Pega tus tokens de Slack.<br />Ver README, sección "Conectar Slack".</p>
      <form id="slack-pairing-form" class="slack-pairing-form">
        <label class="slack-field">
          <span>User OAuth Token</span>
          <input type="password" id="slack-user-token" placeholder="xoxp-…" autocomplete="off" spellcheck="false" />
        </label>
        <label class="slack-field">
          <span>App-Level Token</span>
          <input type="password" id="slack-app-token" placeholder="xapp-…" autocomplete="off" spellcheck="false" />
        </label>
        <label class="slack-checkbox-field">
          <input type="checkbox" id="slack-mention-filter" />
          <span>Solo mostrar DMs y canales donde te mencionan directamente</span>
        </label>
        <button type="submit" id="slack-connect-btn" class="qr-refresh-btn">Conectar</button>
      </form>
      <p class="status-text" id="slack-pairing-status"></p>
    </div>
  </div>

  <!-- App principal (compartida por WhatsApp y Slack) -->
  <div id="app" class="screen hidden">
    <header class="topbar">
      <span class="dot" id="status-dot"></span>
      <span class="topbar-title" id="topbar-title">WhatsApp</span>
      <input type="text" id="chat-search-input" class="chat-search-input hidden" placeholder="Buscar persona o grupo…" />
      <button type="button" id="chat-search-clear-btn" class="search-btn chat-search-clear hidden" aria-label="Limpiar búsqueda">&times;</button>
      <button type="button" id="slack-disconnect-btn" class="search-btn hidden" aria-label="Desconectar Slack" title="Cambiar credenciales de Slack">&#9881;</button>
      <button type="button" id="search-btn" class="search-btn" aria-label="Buscar chats">&#128269;</button>
    </header>

    <div id="chat-list-status" class="inline-status hidden"></div>
    <section id="chat-list" class="chat-list"></section>

    <div class="divider" id="divider" title="Arrastra para ajustar el alto"></div>

    <section id="conversation" class="conversation">
      <div class="conv-empty" id="conv-empty">Selecciona una conversación arriba</div>

      <div class="conv-active hidden" id="conv-active">
        <div class="conv-header">
          <button id="back-btn" class="back-btn" aria-label="Volver">&larr;</button>
          <span id="conv-name" class="conv-name"></span>
        </div>
        <div id="messages" class="messages"></div>
        <div id="mention-list" class="mention-list hidden"></div>
        <div id="emoji-picker" class="emoji-picker hidden"></div>
        <div id="image-preview" class="image-preview hidden">
          <img id="image-preview-img" alt="" />
          <button type="button" id="image-preview-remove" class="image-preview-remove" aria-label="Quitar imagen">&times;</button>
        </div>
        <form id="composer" class="composer">
          <button type="button" id="attach-btn" class="attach-btn" aria-label="Adjuntar imagen">&#128206;</button>
          <input type="file" id="image-input" accept="image/*" class="hidden" />
          <button type="button" id="emoji-btn" class="emoji-btn" aria-label="Emojis">&#9786;</button>
          <textarea id="composer-input" rows="1" placeholder="Escribe un mensaje"></textarea>
          <button type="submit" aria-label="Enviar">&#10148;</button>
        </form>
      </div>
    </section>
  </div>

  <!-- Vista ampliada de imágenes ("modo teatro") -->
  <div id="lightbox" class="lightbox hidden">
    <img id="lightbox-img" alt="Imagen ampliada" />
  </div>

  <script src="renderer.js"></script>
</body>
</html>
